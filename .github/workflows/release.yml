name: Release

# Builds and publishes a release when a v* tag is pushed.
# Needs the updater signing key as the repository secret TAURI_SIGNING_PRIVATE_KEY
# (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has one). Without it, or when the release was already
# published locally, the job is skipped.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check prerequisites
        id: pre
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::No TAURI_SIGNING_PRIVATE_KEY secret: skipping (releases are published locally with scripts/release.mjs)"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::notice::Release ${GITHUB_REF_NAME} already exists: nothing to do"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - if: steps.pre.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.pre.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.pre.outputs.go == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.pre.outputs.go == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: steps.pre.outputs.go == 'true'
        run: npm ci
      - name: Build and publish
        if: steps.pre.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release.mjs --repo ${{ github.repository }} --notes "See CHANGELOG.md"
