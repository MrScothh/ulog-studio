[package]
name = "ulog-studio"
version = "0.1.6"
description = "Offline PX4 ULog flight log analyzer"
authors = ["MrScothh", "ULog Studio contributors"]
license = "BSD-3-Clause"
repository = "https://github.com/MrScothh/ulog-studio"
homepage = "https://mrscothh.github.io/ulog-studio/"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ulog_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
urlencoding = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
